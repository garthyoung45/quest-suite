<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Quest Suite</title>
    <style>
      body{margin:0;background:radial-gradient(circle at 50% 0,#1a2140,#05060d 60%) fixed;color:#eef2ff;font:17px system-ui}
      main{max-width:980px;margin:0 auto;padding:28px 16px 60px}
      h1{font-size:44px;margin:0 0 4px}
      p.sub{color:#b9c3e6;margin:0 0 24px}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
      a.card{display:block;padding:20px;border-radius:16px;background:#141a30;border:1px solid #27304f;color:inherit;text-decoration:none;min-height:120px}
      a.card:hover,a.card:focus{border-color:#4f7cff;background:#1a2242}
      a.card h2{margin:0 0 6px;font-size:23px}
      a.card p{margin:0;color:#b9c3e6;font-size:15px;line-height:1.4}
      .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#27304f;color:#cfd8ff;margin:10px 6px 0 0}
      .soon{opacity:.45;pointer-events:none}
    </style>
  </head>
  <body>
    <main>
      <h1>Quest Suite</h1>
      <p class="sub">Open this page in the Quest browser and pick one. Each also plays on a screen with a PS5 controller or keyboard.</p>
      <div class="grid" id="grid"></div>
    </main>
    <script type="module" src="/src/hub.ts"></script>
  </body>
</html>
